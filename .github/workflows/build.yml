name: Build Armbian for T95 H616
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Fork Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git jq aria2 device-tree-compiler

      - name: Clone Armbian Build System
        run: |
          git clone --depth 1 https://github.com/armbian/build armbian-build

      - name: Compile and Inject T95 DTB
        run: |
          # Создаем папку для пользовательских скриптов Armbian
          mkdir -p armbian-build/userpatches
          
          # Компилируем ваш dts файл из репозитория в рабочий бинарный dtb файл
          dtc -I dts -O dtb -o sun50i-h616-t95-2gb.dtb sun50i-h616-t95-2gb.dts
          
          # Создаем хук-скрипт, который автоматически скопирует наш DTB внутрь собираемого образа системы
          cat << 'EOF' > armbian-build/userpatches/customize-image.sh
          #!/bin/bash
          # Этот скрипт выполняется внутри создаваемой файловой системы Armbian
          mkdir -p /boot/dtb/allwinner/
          cp /tmp/sun50i-h616-t95-2gb.dtb /boot/dtb/allwinner/
          
          # Сразу настраиваем загрузчик, чтобы приставка знала, какой DTB использовать
          if [ -f /boot/armbianEnv.txt ]; then
            echo "fdtfile=allwinner/sun50i-h616-t95-2gb.dtb" >> /boot/armbianEnv.txt
          fi
          EOF
          chmod +x armbian-build/userpatches/customize-image.sh

      - name: Execute Armbian Build
        run: |
          # Копируем скомпилированный DTB в доступное для хука место
          cp sun50i-h616-t95-2gb.dtb /tmp/
          
          cd armbian-build
          # Запускаем сборку стабильного минимального серверного образа CLI (Debian Bookworm)
          sudo ./compile.sh \
            BOARD=orangepi-zero2 \
            BRANCH=current \
            RELEASE=bookworm \
            BUILD_MINIMAL=yes \
            BUILD_DESKTOP=no \
            KERNEL_ONLY=no \
            KERNEL_CONFIGURE=no

      - name: Upload Finished Armbian Image
        uses: actions/upload-artifact@v4
        with:
          name: Armbian_T95_H616_Image
          path: armbian-build/output/images/*.img
