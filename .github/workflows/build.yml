name: Build Armbian for T95 H616

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Fork Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/share/chromium
          sudo docker system prune -af

      - name: Set up QEMU / binfmts
        uses: docker/setup-qemu-action@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git jq aria2 device-tree-compiler qemu-user-static binfmt-support

      - name: Clone Armbian Build System
        run: |
          git clone --depth 1 https://github.com/armbian/build armbian-build

      - name: Compile and Inject T95 DTB
        run: |
          # 1. Компилируем DTS в DTB
          dtc -I dts -O dtb -o sun50i-h616-t95-2gb.dtb sun50i-h616-t95-2gb.dts

          # 2. Создаем оверлей, чтобы передать DTB в файловую систему образа (/tmp)
          mkdir -p armbian-build/userpatches/overlay/tmp/
          cp sun50i-h616-t95-2gb.dtb armbian-build/userpatches/overlay/tmp/

          # 3. Создаем скрипт кастомизации образа
          mkdir -p armbian-build/userpatches
          cat << 'EOF' > armbian-build/userpatches/customize-image.sh
          #!/bin/bash

          # Находим все папки allwinner в /boot (включая динамические версии вроде dtb-6.10.../)
          ALLWINNER_DIRS=$(find /boot -type d -name "allwinner" 2>/dev/null)

          for dir in $ALLWINNER_DIRS; do
            if [ -f /tmp/sun50i-h616-t95-2gb.dtb ]; then
              cp /tmp/sun50i-h616-t95-2gb.dtb "$dir/"
            fi
          done

          # Резервная копия на случай символических ссылок
          mkdir -p /boot/dtb/allwinner
          if [ -f /tmp/sun50i-h616-t95-2gb.dtb ]; then
            cp /tmp/sun50i-h616-t95-2gb.dtb /boot/dtb/allwinner/
          fi

          # Обновляем fdtfile в armbianEnv.txt
          ENV_FILE="/boot/armbianEnv.txt"
          if [ -f "$ENV_FILE" ]; then
            if grep -q "^fdtfile=" "$ENV_FILE"; then
              sed -i 's|^fdtfile=.*|fdtfile=allwinner/sun50i-h616-t95-2gb.dtb|' "$ENV_FILE"
            else
              echo "fdtfile=allwinner/sun50i-h616-t95-2gb.dtb" >> "$ENV_FILE"
            fi
          fi

          # Очищаем временный файл из образа
          rm -f /tmp/sun50i-h616-t95-2gb.dtb
          EOF

          chmod +x armbian-build/userpatches/customize-image.sh

      - name: Execute Armbian Build
        run: |
          cd armbian-build
          sudo ./compile.sh \
            BOARD=orangepizero2 \
            BRANCH=current \
            RELEASE=bookworm \
            BUILD_MINIMAL=yes \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no

      - name: Upload Finished Armbian Image
        uses: actions/upload-artifact@v4
        with:
          name: Armbian_T95_H616_Image
          path: armbian-build/output/images/*.img*
